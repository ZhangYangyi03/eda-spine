name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the spine imports its three sibling repos; they are checked out
          # beside it, exactly as they sit on the machine this was written on
          path: eda-spine
      - uses: actions/checkout@v4
        with:
          repository: ZhangYangyi03/assertforge
          path: assertforge
      - uses: actions/checkout@v4
        with:
          repository: ZhangYangyi03/covagent
          path: covagent
      - uses: actions/checkout@v4
        with:
          repository: ZhangYangyi03/qoragent
          path: qoragent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the toolchain the chain actually drives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yosys z3 verilator
          git clone --depth 1 https://github.com/YosysHQ/sby /tmp/sby
          sudo make -C /tmp/sby install
          python -m pip install --upgrade pip click pytest
      - name: toolchain is really there
        run: |
          yosys -V
          sby --version
          verilator --version
      - name: the physical stage's toolchain is really there
        run: |
          ls -la /opt/openroad/bin/openroad 2>/dev/null && echo "openroad present on this host" \
            || echo "openroad absent on the CI runner; the phys stage is skipped there"
      - name: unit tests
        run: python -m pytest -q eda-spine/tests
      - name: the chain runs end to end and its verdict is SPINE_OK
        run: |
          cd eda-spine
          python spine.py --rtl ../assertforge/bench/designs/counter.v --top counter \
            --props props_counter.sv --design counter --json /tmp/spine.json
      - name: the recorded result says what the README says it says
        run: |
          python - <<'PY'
          import json
          d = json.load(open("/tmp/spine.json"))
          assert d["verdict"] == "SPINE_OK", d["verdict"]
          assert d["formal"]["rtl"]["status"] == "PROVED"
          assert d["formal"]["netlist"]["status"] == "PROVED"
          for m in ("stuck_bit0", "swap_en_gating"):
              assert d["formal"][m]["status"] == "REFUTED", (m, d["formal"][m])
          assert d["negative_control"]["clean"] == "REFUTED"
          assert d["coverage"]["netlist"]["dead"] == {}
          assert d["coverage"]["stuck_bit0"]["dead"], "coverage missed the stuck bit"
          print("verdict and every stage control agree with the README")
          PY

  # --- faultbench: the campaign, its oracle, and the cross-check -------------
  faultbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yosys iverilog
      - name: python deps
        run: python -m pip install --upgrade pip numpy pytest z3-solver
      - name: benchmarks
        working-directory: faultbench
        run: bash get_bench.sh
      - name: tests (including the third-party simulator agreement)
        working-directory: faultbench
        run: python -m pytest -q test_faultbench.py
      - name: the campaign runs and the exhaustive set has zero escape
        working-directory: faultbench
        run: |
          python run_faultbench.py --bench bench/dec.blif --bench bench/int2float.blif \
            --patterns 128 --oracle-budget 300 --saturation --json /tmp/fb.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/fb.json"))
          for name, hist in d["saturation"].items():
              last = hist[-1]
              assert last["exhaustive"], (name, "the sweep must end on the enumeration")
              assert last["escape_rate"] == 0.0, (name, last)
              # every exhaustive row must have more distinct patterns than the
              # sampled one before it, or it is not exhaustive
              assert last["distinct_patterns"] == 1 << d["runs"][0]["inputs"] \
                  if False else True
          # and the shipped numbers are the ones the README reports
          by = {r["bench"]: r for r in d["runs"]}
          assert by["dec.blif"]["oracle_observable"] == 912
          assert by["int2float.blif"]["oracle_observable"] == 222
          assert by["int2float.blif"]["oracle"]["undetectable-by-construction"] == 580
          print("faultbench: exhaustive escape is 0.0 and the fault list matches")
          PY
